
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/gocmay.sqlite
      COOKIE_SECURE: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gocmay
      DB_USER: gocmay_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Required}
    volumes:
      - gocmay_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      MYSQL_DATABASE: gocmay
      MYSQL_USER: gocmay_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  gocmay_data:
  mysql_data:
